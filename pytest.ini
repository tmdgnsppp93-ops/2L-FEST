[pytest]
# 수집 범위를 tests/로 고정한다.
#
# 이유(v28.46): 저장소 루트에서 인자 없이 `pytest`를 돌리면 PyInstaller 산출물인
# dist/ (GEDO.app — 번들된 Python.framework 포함, 2000+ 파일)까지 재귀
# 수집한다. 수집만으로 수십 분을 태우다 `Fatal Python error`로 죽는다.
# `pytest tests/`는 같은 트리를 0.1초에 수집한다. testpaths로 기본값을 그쪽으로
# 고정해 인자 없이 실행해도 안전하게 한다.
testpaths = tests
norecursedirs = dist build .git __pycache__ solcore_xval .pytest_cache

# 마커는 tests/conftest.py의 pytest_configure에서도 등록하지만, 여기 명시해 두면
# `pytest --markers`와 오타 경고(--strict-markers)에 바로 잡힌다.
markers =
    slow: 느린 M10 핀(약 17분)
    bgrade: B등급(샘플링 변경) 허용오차 핀
