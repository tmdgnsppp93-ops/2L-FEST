name: Build Hossain GEDOS Windows

on:
  workflow_dispatch:
  push:
    branches: ['hossain-nfinger1000']

jobs:
  build-windows:
    name: Build Hossain GEDOS on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib customtkinter ezdxf pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name "GEDOS_Nfinger1000"
          --collect-all customtkinter
          --collect-all ezdxf
          GEDOS_Nfinger1000.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GEDOS_Nfinger1000-Windows
          path: dist/GEDOS_Nfinger1000.exe
          if-no-files-found: error
