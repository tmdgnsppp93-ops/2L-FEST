name: Build apps (macOS + Windows)

# PyInstaller can't cross-compile, so we build each OS on its own runner.
# Run manually (Actions tab -> "Run workflow") or push a tag like v28.28.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: 2L-FEST-PRO-macOS
          - os: windows-latest
            artifact: 2L-FEST-PRO-Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib customtkinter ezdxf pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed
          --name "2L-FEST PRO"
          --collect-all customtkinter
          --collect-all ezdxf
          2L_FEST_v28_18_wf_wired.py

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
